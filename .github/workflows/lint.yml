name: Lint Code

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  Lint-Python-Files:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      - name: Print working directory
        run: pwd

      - name: Run Linter
        run: |
          find . -name "*.py" -not -path "./.git/*" | xargs pylint --disable=all --enable=E || true

  Lint-JavaScript-Files:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install JSHint
        run: npm install -g jshint

      - name: Run Linter
        run: |
          find . -name "*.js" -not -path "./.git/*" -not -path "./node_modules/*" | xargs jshint --reporter=unix || true
